services:
  - type: web
    name: sprout-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.1"
      - key: AUTH_DEV_BYPASS
        value: "false"
      - key: DEMO_AUTH_BYPASS
        value: "false"
      - key: DEMO_AUTH_BYPASS_USER_ID
        value: demo-user-0001
      - key: EMAIL_MODE
        value: smtp
      - key: EMAIL_FROM
        value: hello.sprout.team@gmail.com
      # Two different jobs, not a typo for each other:
      #   ADMIN_EMAIL  (singular) -> where UC8 contact tickets are sent
      #                              (ticket.service.ts:10)
      #   ADMIN_EMAILS (plural)   -> the admin-privilege allowlist
      #                              (admin.middleware.ts:18)
      # Only the singular was declared, so every admin route denied the very
      # account this file named.
      - key: ADMIN_EMAIL
        value: hello.sprout.team@gmail.com
      - key: ADMIN_EMAILS
        value: hello.sprout.team@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: hello.sprout.team@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Was "true" while nothing read it. Now that it does, leaving it true
      # would serve every player a placeholder drawing instead of their plant.
      - key: USE_MOCK_APIS
        value: "false"
      - key: MIN_CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Every scan writes its species sprite here. sprite-storage.ts throws
      # without it, which fails the whole scan-to-archive path (UC6 -> UC4).
      # Bucket live since 2026-07-21; see server/FIREBASE_SETUP.md.
      - key: FIREBASE_STORAGE_BUCKET
        value: sprout-dev-66f08.firebasestorage.app
