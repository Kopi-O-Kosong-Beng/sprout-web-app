services:
  - type: web
    name: sprout-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.1"
      - key: DATASTORE
        value: firestore
      - key: AUTH_DEV_BYPASS
        value: "false"
      - key: DEMO_AUTH_BYPASS
        value: "false"
      - key: DEMO_AUTH_BYPASS_USER_ID
        value: demo-user-0001
      - key: EMAIL_MODE
        value: smtp
      - key: EMAIL_FROM
        value: hello.sprout.team@gmail.com
      - key: ADMIN_EMAIL
        value: hello.sprout.team@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: hello.sprout.team@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: USE_MOCK_APIS
        value: "true"
      - key: MIN_CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: CORS_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
