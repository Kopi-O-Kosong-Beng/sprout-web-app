<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sprout — Backend Test Form</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 14px; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
  #result { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 14px; white-space: pre-wrap; }
  .ok { background: #e6f4ea; border: 1px solid #34a853; }
  .err { background: #fce8e6; border: 1px solid #d93025; }
  #health { font-size: 13px; color: #555; margin-bottom: 16px; }
</style>
</head>
<body>
  <h1>🌱 Sprout — Query Ticket Test Form</h1>
  <div id="health">Checking backend…</div>

  <form id="ticketForm">
    <label>Name <input name="name" required value="Test User" /></label>
    <label>Email <input name="email" type="email" required value="test@example.com" /></label>
    <label>Category
      <select name="category" required>
        <option value="general">General</option>
        <option value="bug">Bug</option>
        <option value="billing">Billing</option>
        <option value="partnership">Partnership</option>
        <option value="other">Other</option>
      </select>
    </label>
    <label>Message <textarea name="message" rows="4" required>Testing the ticket endpoint from a real browser form.</textarea></label>
    <button type="submit">Submit Ticket</button>
  </form>

  <div id="result"></div>

  <script>
    const API_BASE = 'http://localhost:3001';

    fetch(`${API_BASE}/api/health`)
      .then(r => r.json())
      .then(d => { document.getElementById('health').textContent = `Backend: ${d.status} (as of ${d.timestamp})`; })
      .catch(() => { document.getElementById('health').textContent = '⚠️ Backend not reachable at ' + API_BASE; });

    document.getElementById('ticketForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const resultEl = document.getElementById('result');
      resultEl.className = '';
      resultEl.textContent = 'Submitting…';
      try {
        const res = await fetch(`${API_BASE}/api/query/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const body = await res.json();
        resultEl.className = res.ok ? 'ok' : 'err';
        resultEl.textContent = `HTTP ${res.status}\n${JSON.stringify(body, null, 2)}`;
      } catch (err) {
        resultEl.className = 'err';
        resultEl.textContent = 'Request failed: ' + err.message;
      }
    });
  </script>
</body>
</html>
