<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/app_logo.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the game screens extend behind the notch and the
         home indicator; the .safe-top / .safe-bottom helpers pad them back.
         No maximum-scale: pinch zoom is an accessibility right (WCAG 1.4.4),
         and the double-tap-zoom problem it once papered over is already solved
         by touch-action: manipulation on the pressable chrome. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Sprout brand green, sampled from the logo card. -->
    <meta name="theme-color" content="#203727" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS Safari has long keyed off this legacy tag to launch without browser
         chrome. Both are declared so full-screen mode does not rely on aliasing. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Scan real plants. Battle them. Sprout identifies a species from a photo, renders it as a pixel-art creature, and gives it a moveset drawn from its real botanical taxonomy."
    />
    <title>Sprout — Scan real plants. Battle them.</title>

    <!-- Press Start 2P is self-hosted (see the @font-face in index.css) and
         carries the game chrome. These three serve the studio section: Inter for
         its dense operational copy, JetBrains Mono for telemetry, Silkscreen for
         its section kickers. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-full antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
