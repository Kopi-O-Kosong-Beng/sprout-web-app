# nginx configuration for the containerised Sprout frontend.
#
# This file reproduces, for the container, what vercel.json already does for the
# hosted deployment. The two must stay in step: a route that works on Vercel and
# 404s in the container (or the reverse) is worse than not containerising the
# frontend at all, because it makes the image an unreliable witness.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # This is the `rewrites` block in vercel.json, expressed for nginx.
    #
    # React Router owns /archive, /battle, /leaderboard and the rest on the
    # client. Those paths are not files on disk, so a hard refresh or a pasted
    # link would 404 without this. try_files asks for the literal file, then a
    # directory, then hands index.html to the router. Note the LAST fallback is
    # a file, not a redirect: the URL the user typed must survive so the router
    # can read it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caching ──────────────────────────────────────────────────────────────
    # Vite fingerprints asset filenames with a content hash, so a changed file
    # is a changed URL and these can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must NOT be cached: it is the document that names the current
    # fingerprinted bundles. A stale copy pins a returning visitor to the
    # previous deployment's assets — which, since the old hashed files are gone,
    # is a blank page rather than an old version.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Static art the archive renders. Same reasoning as /assets/, but these
    # filenames are stable rather than hashed, so the window is shorter.
    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Response headers ─────────────────────────────────────────────────────
    # Defence in depth only. The API enforces its own CORS and auth; these
    # protect the document itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container-local health target for the image's HEALTHCHECK. Deliberately
    # not proxied to the API: this answers "is the frontend being served?", and
    # coupling it to the backend would report the frontend as unhealthy whenever
    # the API had a bad minute — the same liveness/readiness confusion the
    # server side takes care to avoid.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
