# Sprout focused test suites (Checkoff 3 evidence set).
#
# Mirrors the six non-overlapping focused command groups recorded in
# docs/checkoff3/archive-pve-verification-evidence.md so every pull request
# to main re-runs the same evidence commands (223 assertions across 11 files
# at the time of recording).
#
# No secrets are required: server tests force the Firestore Emulator
# (tests/setup-env.ts sets FIRESTORE_EMULATOR_HOST/GCLOUD_PROJECT and strips
# service-account variables), email runs in console mode, and client tests
# mock sproutApi at the network boundary.

name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-focused:
    name: Server focused suites (Jest + Firestore Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The Firestore Emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # firebase-tools downloads the emulator jar on first use.
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - name: Install workspaces
        run: npm ci
        working-directory: .

      - name: Typecheck server
        run: npm run typecheck

      # Always invoke the server-local jest entrypoint (jest 29) through node.
      # The root node_modules hoists a jest 30 peer of ts-jest, and a bare
      # `jest` on the PATH can resolve to it inside emulators:exec, mixing
      # jest 30's runtime with the server's jest 29 test environment
      # ("clearMocksOnScope is not a function"). `node node_modules/jest/...`
      # is unambiguous and works under both sh (CI) and cmd (local Windows).
      - name: 'Group 1: eligibility + catalog + species/sprite/scan/pipeline-auth unit suites (no emulator)'
        run: node node_modules/jest/bin/jest.js --runInBand --runTestsByPath tests/battle-eligibility.test.ts tests/battle-catalog.test.ts tests/species-stats.test.ts tests/sprite-storage.test.ts tests/scan-persistence.test.ts tests/pipeline-auth.test.ts

      - name: 'Group 2: Firestore battle repository + avatar HTTP API + avatar upsert/discovery + dex repository + scan complete event'
        run: npm exec -- firebase emulators:exec --project sprout-test --only firestore "node node_modules/jest/bin/jest.js --runInBand --runTestsByPath tests/battle-repository.test.ts tests/avatar-api.test.ts tests/avatar-upsert.test.ts tests/dex-repository.test.ts tests/avatar-discovery-api.test.ts tests/pipeline-complete-event.test.ts"

      - name: 'Group 3: PVE HTTP API'
        run: npm exec -- firebase emulators:exec --project sprout-test --only firestore "node node_modules/jest/bin/jest.js --runInBand --runTestsByPath tests/battle-api.test.ts"

      - name: 'Group 4: battle engine unit/property + demo archive'
        run: npm exec -- firebase emulators:exec --project sprout-test --only firestore "node node_modules/jest/bin/jest.js --runInBand --runTestsByPath tests/battle-engine.test.ts tests/battle-engine.property.test.ts tests/avatar-demo.test.ts"

      - name: 'Group 7: admin account management + auth/query/email'
        run: npm exec -- firebase emulators:exec --project sprout-test --only firestore "node node_modules/jest/bin/jest.js --runInBand --runTestsByPath tests/admin-api.test.ts tests/auth.test.ts tests/query.test.ts tests/email.test.ts"

      # The sprite-asset pact lives in the pipeline's vitest half (it guards
      # files the pipeline renders). No emulator, no Java, a few ms — but
      # without this step the guard never ran in CI and seeded URLs could
      # drift from disk again unnoticed.
      - name: 'Group 9: sprite-asset pact (vitest, no emulator)'
        run: npm exec -- vitest run pipeline/__tests__/spriteAssets.test.ts --coverage.enabled=false

      # The image ingest gate and the fuzzer aimed at it. Free and offline: the
      # sink is validateUploadedImage, the same function /api/pipeline/run-stream
      # calls on every scan, so no external API is touched and no secret is
      # needed. Deterministic by construction — the rng seed is fixed in the
      # spec, so a red run here is reproducible from this log alone by running
      # the same command locally.
      #
      # The LIVE fuzzer is deliberately not here: it spends API credits and is
      # reachable only from the fuzz-live workflow_dispatch job.
      - name: 'Group 10: image ingest + fuzz (vitest, no emulator)'
        run: |
          npm exec -- vitest run \
            pipeline/__tests__/imageIngest.test.ts \
            pipeline/__tests__/imageIngest.fuzz.test.ts \
            --coverage.enabled=false

  client-focused:
    name: Client focused suites (Vitest + Testing Library)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm ci
        working-directory: .

      # Vite strips types without checking them, so before this step `tsc` only
      # ever ran inside `npm run build` — that is, on Vercel, after merge. A
      # client type error passed every check here and failed the deploy instead
      # (PR #14, TS2698 in ScanPage). Same command the build front-ends.
      - name: Typecheck client
        run: npm run typecheck

      - name: 'Group 5: BattlePage + AppHeader navigation lock'
        run: npm exec -- vitest run src/pages/BattlePage.test.tsx src/components/common/AppHeader.navigation-lock.test.tsx

      - name: 'Group 6: ArchivePage + ScanPage'
        run: npm exec -- vitest run src/pages/ArchivePage.test.tsx src/pages/ScanPage.test.tsx

      - name: 'Group 8: auth pages (incl. Google sign-in) + admin dashboard'
        run: npm exec -- vitest run src/pages/LoginPage.test.tsx src/pages/SignupPage.test.tsx src/pages/AdminPage.test.tsx
