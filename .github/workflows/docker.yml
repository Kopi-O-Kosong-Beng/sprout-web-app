# Container build, smoke test, and publish.
#
# ── Why this workflow is the evidence, not a convenience ─────────────────────
# The Dockerfiles were authored on a Windows machine with no Docker installed.
# An unbuilt Dockerfile is a claim, not an artefact, and the whole argument for
# containerising this project is that "it works on my machine" is not evidence.
# It would be incoherent to make that argument from an image nobody had built.
#
# So CI is where the image is proven: it builds on Linux, starts the container,
# waits for the health endpoint the Dockerfile declares, asserts the readiness
# endpoint reports per-dependency status, and checks the container stops on
# SIGTERM within its grace period rather than being killed. Every one of those
# is a property claimed elsewhere in the repository and none was previously
# checked by anything.
#
# On a push to main the API image is also published to GHCR, so the submission
# is a pullable image rather than a file that is asserted to build.

name: docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Declared empty and filled at run time by the publish job, which lowercases
  # github.repository before use. Declaring it here is not decorative: without
  # it the workflow linter flags every ${{ env.IMAGE_PATH }} reference as an
  # undefined context.
  IMAGE_PATH: ""

jobs:
  # ===========================================================================
  # API image — build, run, and verify the behaviour the Dockerfile promises
  # ===========================================================================
  server-image:
    name: API image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          tags: sprout-server:ci
          load: true
          # Cache through the Actions cache so later runs reuse the npm ci
          # layer instead of resolving the dependency tree every time.
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Report image size
        # Recorded rather than asserted. A threshold here would fail builds for
        # a legitimate dependency addition; the number is useful as a trend and
        # as a figure the report can quote honestly.
        run: |
          bytes=$(docker image inspect sprout-server:ci --format '{{.Size}}')
          echo "API image size: $bytes bytes ($(( bytes / 1024 / 1024 )) MB)"

      - name: Confirm the image does not run as root
        run: |
          user=$(docker image inspect sprout-server:ci --format '{{.Config.User}}')
          echo "configured user: '$user'"
          test "$user" = "node"

      - name: Start the container
        # No credentials. Firebase Admin has none, so any route touching
        # Firestore will fail — which is fine and is the point: /api/health must
        # answer anyway, because liveness is not allowed to depend on a backing
        # service. That is the property under test.
        run: |
          docker run -d --name sprout-api-ci \
            -p 3001:3001 \
            -e NODE_ENV=production \
            -e GCLOUD_PROJECT=sprout-ci \
            sprout-server:ci

      - name: Wait for liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/health > /tmp/health.json; then
              echo "healthy after ${attempt}s"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "::error::/api/health never became reachable"
          docker logs sprout-api-ci
          exit 1

      - name: Liveness must not depend on a backing service
        run: |
          # No Firebase credentials are configured, so if this endpoint ever
          # starts consulting Firestore this assertion fails — which is exactly
          # the regression it exists to catch. A liveness probe that depends on
          # a database turns a database blip into a restart loop.
          status=$(curl -fsS http://localhost:3001/api/health | jq -r '.status')
          test "$status" = "ok"

      - name: Readiness must report per-dependency status
        run: |
          # 503 is the expected answer here: there are no credentials, so the
          # firestore probe cannot succeed. What is being proved is that the
          # endpoint answers at all, distinguishes its dependencies by name, and
          # does not 500.
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:3001/api/health/ready)
          echo "readiness HTTP $code"; cat /tmp/ready.json
          test "$code" = "503"
          test "$(jq -r '.status' /tmp/ready.json)" = "not_ready"
          test "$(jq -r '.checks | length' /tmp/ready.json)" -ge 2
          jq -e '.checks[] | select(.name == "firestore")' /tmp/ready.json > /dev/null
          jq -e '.checks[] | select(.name == "storage_bucket_configured")' /tmp/ready.json > /dev/null

      - name: Container stops gracefully on SIGTERM
        run: |
          # `docker stop` sends SIGTERM and waits before SIGKILL. Without the
          # handler in server/lifecycle.ts the process would ignore it and the
          # stop would take the full timeout. Ten seconds of headroom over a
          # drain that should be instant on an idle container.
          start=$(date +%s)
          docker stop --timeout 15 sprout-api-ci
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          test "$elapsed" -lt 10

          # 0 = drained cleanly. 137 would mean SIGKILL, i.e. the signal was
          # ignored; 1 would mean the drain timed out internally.
          code=$(docker inspect sprout-api-ci --format '{{.State.ExitCode}}')
          echo "exit code: $code"
          test "$code" = "0"

          docker logs sprout-api-ci 2>&1 | grep -q 'drained cleanly'

      - name: Container logs
        if: always()
        run: docker logs sprout-api-ci 2>&1 || true

  # ===========================================================================
  # Frontend image
  # ===========================================================================
  client-image:
    name: Frontend image (build + serve test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          tags: sprout-client:ci
          load: true
          build-args: |
            VITE_API_URL=http://localhost:3001
            VITE_ENABLE_DEMO_TOOLS=false
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Start the container
        run: docker run -d --name sprout-web-ci -p 8088:80 sprout-client:ci

      - name: Serves the application shell
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8088/ -o /tmp/index.html; then break; fi
            sleep 1
          done
          grep -qi '<div id="root"' /tmp/index.html

      - name: Deep links fall back to index.html, matching vercel.json
        run: |
          # React Router owns /archive; it is not a file on disk. If this 404s,
          # the container and the Vercel deployment disagree about routing and
          # the image is an unreliable witness for the hosted product.
          code=$(curl -s -o /tmp/deep.html -w '%{http_code}' http://localhost:8088/archive)
          test "$code" = "200"
          grep -qi '<div id="root"' /tmp/deep.html

      - name: Container logs
        if: always()
        run: docker logs sprout-web-ci 2>&1 || true

  # ===========================================================================
  # Compose stack — the API and the emulator actually talking to each other
  # ===========================================================================
  compose-stack:
    name: Compose stack (API + Firestore emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Bring the stack up
        run: docker compose up --build -d

      - name: Readiness reports Firestore as reachable
        run: |
          # The difference from the standalone job: here a real Firestore
          # emulator is attached over the compose network, so the firestore
          # probe must report ok. This is what proves the containers are wired
          # to each other and not merely running side by side.
          #
          # Poll on the probe's own verdict, not on the HTTP status. Readiness
          # answers 503 while Storage is unconfigured — which it always is in
          # this stack — so treating any response as success would pass before
          # the emulator had finished starting.
          for attempt in $(seq 1 60); do
            curl -s -o /tmp/ready.json http://localhost:3001/api/health/ready || true
            if [ -s /tmp/ready.json ] && \
               [ "$(jq -r '.checks[]? | select(.name=="firestore") | .status' /tmp/ready.json)" = "ok" ]; then
              echo "firestore reachable after ${attempt} poll(s)"
              cat /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::firestore probe never reported ok"
          cat /tmp/ready.json || true
          docker compose logs
          exit 1

      - name: Frontend is served
        run: curl -fsS http://localhost:5173/ -o /dev/null

      - name: Stack logs
        if: always()
        run: docker compose logs || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

  # ===========================================================================
  # Demo stack — the handover build, which must be usable by someone with no
  # keys, no Firebase project and nobody from the team in the room.
  #
  # Every assertion below corresponds to a way this stack was previously broken.
  # They are here so it cannot quietly break again between now and the showcase.
  # ===========================================================================
  demo-stack:
    name: Demo stack (sign-in + storage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Bring the demo stack up
        run: docker compose -f docker-compose.demo.yml up --build -d

      - name: Readiness reports BOTH dependencies ok
        run: |
          # Unlike the plain compose stack, this one must reach 200. Storage is
          # emulated here, so the probe that is permanently `failed` over there
          # has to pass over here — that is the whole point of this stack, and a
          # scan cannot persist a sprite without it.
          for attempt in $(seq 1 90); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:3001/api/health/ready || true)
            if [ "$code" = "200" ]; then
              echo "ready after ${attempt} poll(s)"
              jq . /tmp/ready.json
              exit 0
            fi
            sleep 2
          done
          echo "::error::readiness never reached 200 — a dependency probe is failing"
          jq . /tmp/ready.json || cat /tmp/ready.json || true
          docker compose -f docker-compose.demo.yml logs
          exit 1

      - name: The seed ran to completion
        run: |
          # A one-shot service, so it should be exited(0) rather than running.
          # An empty database is not a broken demo, but it is a worse one, and a
          # silently failed seed is invisible from the outside.
          status=$(docker inspect -f '{{.State.Status}}:{{.State.ExitCode}}' sprout-demo-seed)
          echo "seed container: ${status}"
          [ "$status" = "exited:0" ] || {
            echo "::error::seed did not complete cleanly"
            docker logs sprout-demo-seed || true
            exit 1
          }

      - name: A demo identity can actually reach a protected route
        run: |
          # Blocker this guards: with AUTH_DEV_BYPASS off, or NODE_ENV left at
          # production, every protected route answers 401 and the demo is a
          # landing page. /api/auth/me is the route the client calls first on
          # sign-in, so if this passes the session establishes.
          code=$(curl -s -o /tmp/me.json -w '%{http_code}' \
            -H 'x-dev-uid: dev-admin-0001' \
            -H 'x-dev-email: test@sprout.com' \
            http://localhost:3001/api/auth/me || true)
          echo "GET /api/auth/me -> ${code}"
          cat /tmp/me.json || true
          [ "$code" = "200" ] || {
            echo "::error::the demo identity cannot sign in"
            docker compose -f docker-compose.demo.yml logs api
            exit 1
          }

      - name: An unauthenticated caller is still refused
        run: |
          # The bypass must open a door for the demo identity WITHOUT opening
          # the route to everyone. If this ever returns 200 the stack is not a
          # demo, it is an unauthenticated API.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/auth/me || true)
          echo "GET /api/auth/me (no headers) -> ${code}"
          [ "$code" = "401" ] || {
            echo "::error::expected 401 without credentials, got ${code}"
            exit 1
          }

      - name: The served bundle keeps its sign-in path
        run: |
          # Blocker this guards: `import.meta.env.DEV` is compiled to a literal.
          # A production-mode bundle minifies the gate to `return!1` and no
          # amount of correct server configuration can rescue it. Assert on the
          # bytes nginx actually serves, not on the build command.
          curl -fsS http://localhost:5173/ -o /tmp/index.html
          bundle=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' /tmp/index.html | head -1)
          echo "bundle: ${bundle}"
          curl -fsS "http://localhost:5173${bundle}" -o /tmp/bundle.js
          grep -q 'sprout-dev-session' /tmp/bundle.js || {
            echo "::error::dev session module missing from the bundle"
            exit 1
          }
          # The gate sits immediately after the storage-key literal. `return!0`
          # is enabled; `return!1` is the production fence, correct everywhere
          # else and fatal here.
          if grep -qo 'sprout-dev-session`;function [A-Za-z0-9_$]*(){return!1}' /tmp/bundle.js; then
            echo "::error::bundle was built in production mode — nobody can sign in"
            exit 1
          fi
          grep -qo 'sprout-dev-session`;function [A-Za-z0-9_$]*(){return!0}' /tmp/bundle.js || {
            echo "::error::could not confirm the sign-in gate is enabled"
            exit 1
          }
          echo "sign-in gate is enabled in the served bundle"

      - name: Sprite URLs are addressed to the browser, not the compose network
        run: |
          # Blocker this guards: the API writes sprites to `firestore:9199` over
          # the compose network, a name no browser outside compose can resolve.
          # Without FIREBASE_STORAGE_PUBLIC_HOST every archive image is broken,
          # and it breaks silently — the scan succeeds and the picture does not
          # load. Assert the container carries the override.
          public_host=$(docker exec sprout-demo-api printenv FIREBASE_STORAGE_PUBLIC_HOST)
          echo "FIREBASE_STORAGE_PUBLIC_HOST=${public_host}"
          case "$public_host" in
            *localhost*) echo "download URLs are browser-resolvable" ;;
            *) echo "::error::public storage host is not browser-resolvable"; exit 1 ;;
          esac
          # And the host can genuinely fetch a sprite URL of the shape the app
          # builds. Ask for an object that does not exist: a 404 from the
          # emulator's own download route proves both that the port is reachable
          # from outside the compose network and that it is routing the exact
          # path `downloadUrl()` constructs. Probing `/` instead would prove
          # neither — the emulator answers 501 there, since it implements the
          # storage API rather than a web root.
          url='http://localhost:9199/v0/b/sprout-local.appspot.com/o/sprites%2Fabsent%2Fv1.png?alt=media'
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
          echo "GET (absent sprite) -> ${code}"
          [ "$code" = "404" ] || {
            echo "::error::expected 404 from the storage emulator's download route, got ${code}"
            echo "000 means the host cannot reach the emulator at all — sprite images would be broken in the browser."
            exit 1
          }

      - name: Stack logs
        if: always()
        run: docker compose -f docker-compose.demo.yml logs || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v || true

  # ===========================================================================
  # Publish — only from main, so the submission is a pullable image
  # ===========================================================================
  publish:
    name: Publish API image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [server-image, client-image, compose-stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token — no secret to create or rotate for the org.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve a lowercase image path
        # GHCR rejects uppercase in a repository path, and this org's name has
        # three capitals (Kopi-O-Kosong-Beng). github.repository preserves them,
        # so pushing it verbatim fails at the registry rather than at build.
        run: |
          echo "IMAGE_PATH=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          # Both tags: `latest` for a human, the commit SHA so a report or a
          # judge can pull the exact image a claim refers to.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}-server:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}-server:${{ github.sha }}
          cache-from: type=gha,scope=server
